---
- name: Base machine configuration
  hosts:
    - servers
  become: true
  become_user: root
  roles:
    - name: network_dns
    - name: network_dhcpcd
    - name: xbps
    - name: dnscrypt_proxy
      when: dnscrypt_proxy_enabled | default(false)
    - name: chrony
    - name: crond
    - name: miniflux
      when: miniflux_enabled | default(false)
    - name: soju
      when: soju_enabled | default(false)
