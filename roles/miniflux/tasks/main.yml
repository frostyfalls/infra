---
- name: Install packages
  community.general.xbps:
    name: miniflux
    state: present
- name: Deploy configuration
  ansible.builtin.template:
    src: miniflux.conf.j2
    dest: /etc/miniflux.conf
    owner: root
    group: _miniflux
    mode: '0640'
  notify: miniflux
- name: Deploy service configuration
  ansible.builtin.copy:
    content: |
      OPTS="-c /etc/miniflux.conf"
    dest: /etc/sv/miniflux/conf
    owner: root
    group: root
    mode: '0644'
  notify: miniflux
- name: Enable service
  community.general.runit:
    name: miniflux
    enabled: true
